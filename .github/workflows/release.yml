name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore EfCore.MultiTenancy.slnx

      - name: Test
        run: dotnet test EfCore.MultiTenancy.slnx -c Release --no-restore

      - name: Pack
        run: |
          for project in \
            src/EfCore.MultiTenancy.Core/EfCore.MultiTenancy.Core.csproj \
            src/EfCore.MultiTenancy.EfCore/EfCore.MultiTenancy.EfCore.csproj \
            src/EfCore.MultiTenancy.AspNetCore/EfCore.MultiTenancy.AspNetCore.csproj; do
            dotnet pack "$project" -c Release --no-restore \
              -p:Version=${{ steps.version.outputs.version }} \
              -o ./artifacts
          done

      - name: Push to NuGet
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
