services:
  postgres:
    image: postgres:16-alpine
    container_name: efcore-multitenancy-sample-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: multitenancy_sample
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - efcore-multitenancy-sample-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  efcore-multitenancy-sample-pgdata:
